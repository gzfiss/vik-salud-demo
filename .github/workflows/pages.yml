name: Probar y publicar VIK Demo
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v6
      - name: Probar adaptador local
        run: node --test tests/demo.test.cjs
      - name: Revisar sintaxis
        run: npm run check
      - name: Preparar Pages
        uses: actions/configure-pages@v5
      - name: Empaquetar demo
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
